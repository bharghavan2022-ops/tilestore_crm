services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tilestore
      POSTGRES_PASSWORD: tilestore
      POSTGRES_DB: tilestore_crm
    ports:
      - "5432:5432"
    volumes:
      - tilestore_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tilestore -d tilestore_crm"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tilestore_pg_data:
